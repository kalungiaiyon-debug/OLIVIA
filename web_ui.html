<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olivia</title>
<style>
:root{--bg:__BACKGROUND__;--ink:#17211b;--muted:#66736a;--accent:#e86b47;--glass:rgba(255,255,255,.78);--dark:rgba(27,39,32,.9)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:15px system-ui,sans-serif;background:var(--bg);background-size:cover;background-position:center; background-attachment:fixed}body:before{content:"";position:fixed;inset:0;background:rgba(20,25,22,.18);pointer-events:none}.shell{position:relative;min-height:100vh;display:grid;grid-template-columns:240px minmax(0,820px);gap:18px;justify-content:center;padding:22px}.sidebar,.main{border:1px solid rgba(255,255,255,.32);box-shadow:0 18px 60px rgba(0,0,0,.2);backdrop-filter:blur(12px)}.sidebar{display:flex;flex-direction:column;gap:18px;padding:20px 15px;border-radius:18px;background:var(--dark);color:white}.brand{font:700 28px Georgia,serif}.tagline{color:rgba(255,255,255,.7);font-size:12px;line-height:1.5}.new{border:0;border-radius:9px;padding:12px;text-align:left;background:var(--accent);color:white;font-weight:700;cursor:pointer}.recent{display:flex;flex-direction:column;gap:5px;overflow:auto}.recent button{border:0;border-radius:8px;padding:10px;background:transparent;color:rgba(255,255,255,.78);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.recent button:hover{background:rgba(255,255,255,.12)}.status{margin-top:auto;color:#bfe5bf;font-size:12px}.main{min-height:calc(100vh - 44px);display:flex;flex-direction:column;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.12)}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid rgba(255,255,255,.28);color:white}.top h1{margin:0;font:600 25px Georgia,serif;text-shadow:0 3px 15px rgba(0,0,0,.35)}.model{font-size:12px;color:rgba(255,255,255,.8)}.messages{flex:1;min-height:0;overflow:auto;padding:30px;display:flex;flex-direction:column;gap:16px}.welcome{margin:auto;max-width:500px;text-align:center;color:white}.welcome h2{margin:0 0 10px;font:600 40px Georgia,serif;text-shadow:0 3px 15px rgba(0,0,0,.35)}.welcome p{color:rgba(255,255,255,.85);line-height:1.6}.message{max-width:min(76%,620px);padding:13px 17px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 8px 22px rgba(0,0,0,.16);animation:rise .25s ease both}.message.user{align-self:flex-end;background:rgba(232,107,71,.95);color:white;border-bottom-right-radius:6px}.message.assistant{align-self:flex-start;background:rgba(255,255,255,.94);border-bottom-left-radius:6px}.message.error{background:#ffe2dc;color:#8c291c}.thinking{color:var(--muted)}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.composer{padding:15px 20px 20px;border-top:1px solid rgba(255,255,255,.28)}form{display:flex;gap:9px;align-items:flex-end;padding:8px;border-radius:14px;background:rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(0,0,0,.18)}textarea{flex:1;min-height:44px;max-height:150px;resize:none;border:0;outline:0;padding:10px;background:transparent;color:var(--ink)}button.send,button.voice{border:0;border-radius:9px;height:42px;cursor:pointer}button.send{width:45px;background:var(--accent);color:white;font-size:18px}button.voice{width:42px;background:#26382d;color:white;font-size:16px}button.voice.listening{background:#b52e49}.tools{display:flex;gap:14px;align-items:center;padding:8px 4px 0;color:white;font-size:12px}.tools label{cursor:pointer}.tools input[type=file]{display:none}.hint{margin-left:auto;color:rgba(255,255,255,.72)}@media(max-width:760px){.shell{display:block;padding:10px}.sidebar{margin-bottom:10px}.recent{display:none}.main{min-height:calc(100vh - 20px)}.message{max-width:88%}.hint{display:none}}
/* Let the chosen photo remain the main visual surface. */
.shell{grid-template-columns:190px minmax(0,820px);gap:24px;padding:22px}
.sidebar,.main{border:0;box-shadow:none;backdrop-filter:none;background:transparent}
.sidebar{padding:20px 8px}
.brand,.tagline,.status,.recent button,.model,.top h1{text-shadow:0 2px 10px rgba(0,0,0,.7)}
.main{border-radius:0}
.top{padding:22px 0 12px;border-bottom:0}
.messages{padding:30px 0}
body:before{background:rgba(20,25,22,.04)}
.composer{padding-left:0;padding-right:0}
form{background:rgba(255,255,255,.84);box-shadow:0 8px 20px rgba(0,0,0,.14)}
@media(max-width:760px){.shell{padding:10px}.sidebar{padding:10px 4px}.messages{padding:20px 0}}
</style>
</head>
<body><div class="shell"><aside class="sidebar"><div class="brand">Olivia</div><div class="tagline">A calm place to think, write, plan, and make things.</div><button class="new" id="newChat">+ New conversation</button><div class="recent" id="recent"></div><div class="status" id="status">Ready</div></aside><main class="main"><header class="top"><h1>New conversation</h1><span class="model" id="model">Olivia</span></header><section class="messages" id="messages"><div class="welcome" id="welcome"><h2>What are you working on?</h2><p>Ask Olivia to explain, write, plan, code, or think through a problem with you.</p></div></section><div class="composer"><form id="composer"><button class="voice" id="voice" type="button" title="Voice input">●</button><textarea id="input" rows="1" placeholder="Message Olivia..."></textarea><button class="send" id="send" type="submit" title="Send">↑</button></form><div class="tools"><label>＋ image<input id="file" type="file" accept="image/*"></label><label><input id="web" type="checkbox"> web context</label><span class="hint">Enter to send · Shift+Enter for a new line</span></div></div></main></div>
<script>
const $=id=>document.getElementById(id),messages=$('messages'),input=$('input'),send=$('send');let conversations=JSON.parse(localStorage.getItem('olivia-history')||'[]');
function save(){localStorage.setItem('olivia-history',JSON.stringify(conversations.slice(-20)))}
function renderRecent(){$('recent').innerHTML=conversations.map((x,i)=>`<button onclick="loadConversation(${i})">${escapeHtml(x.title)}</button>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function add(role,text,extra=''){const item=document.createElement('div');item.className=`message ${role} ${extra}`;item.textContent=text;messages.appendChild(item);messages.scrollTop=messages.scrollHeight;return item}
function clearWelcome(){const w=$('welcome');if(w)w.remove()}
function loadConversation(i){clearWelcome();messages.innerHTML='';for(const m of conversations[i].messages)add(m.role,m.text);}
$('newChat').onclick=()=>{messages.innerHTML='<div class="welcome" id="welcome"><h2>What are you working on?</h2><p>Ask Olivia to explain, write, plan, code, or think through a problem with you.</p></div>';input.focus()};
$('file').onchange=e=>{const file=e.target.files[0];if(file){clearWelcome();add('user','Image attached: '+file.name);$('status').textContent='Image selected';}};
$('composer').onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;clearWelcome();input.value='';add('user',text);const pending=add('assistant thinking','Thinking...');send.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,web_search:$('web').checked})});const d=await r.json();if(!r.ok)throw Error(d.error||'Message failed');pending.className='message assistant';pending.textContent=d.response;conversations.push({title:text.slice(0,40),messages:[{role:'user',text},{role:'assistant',text:d.response}]});save();renderRecent();$('status').textContent='Ready'}catch(err){pending.className='message assistant error';pending.textContent=err.message;$('status').textContent='Provider error'}finally{send.disabled=false;input.focus()}};
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit()}};
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(Recognition){const recognition=new Recognition();$('voice').onclick=()=>recognition.start();recognition.onresult=e=>{input.value=e.results[0][0].transcript;$('composer').requestSubmit()}}else $('voice').disabled=true;
renderRecent();
</script></body></html>
